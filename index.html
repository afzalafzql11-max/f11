<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Missing Link System</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="topbar">
  <div class="menu-btn" onclick="toggleMenu()">☰</div>
  <h2>Missing Link System</h2>
</div>

<div id="sideMenu" class="side-menu">
  <button onclick="showPage('dashboard'); toggleMenu()">🏠 Dashboard</button>
  <button onclick="showPage('crosscheck'); toggleMenu()">🔍 Cross Check</button>
  <button onclick="showPage('register'); toggleMenu()">📤 Upload Child</button>
  <button onclick="logout(); toggleMenu()">🚪 Logout</button>
</div>

<!-- LOGIN -->
<div class="container page" id="login">
  <h2>Login</h2>
  <input id="login_email" placeholder="Email">
  <input id="login_pass" type="password" placeholder="Password">
  <button onclick="login()">Login</button>
  <button onclick="showPage('signup')">Create Account</button>
</div>

<!-- SIGNUP -->
<div class="container page" id="signup">
  <h2>Signup</h2>
  <input id="su_name" placeholder="Name">
  <input id="su_email" placeholder="Email">
  <input id="su_pass" type="password" placeholder="Password">
  <button onclick="signup()">Signup</button>
  <button onclick="showPage('login')">Back</button>
</div>

<!-- DASHBOARD -->
<div class="container page" id="dashboard">
  <h2>Dashboard</h2>
  <div id="childrenContainer"></div>
</div>

<!-- REGISTER -->
<div class="container page" id="register">
  <h2>Upload Child</h2>
  <input id="child_name" placeholder="Name">
  <input id="child_age" type="number" placeholder="Age">
  <input id="child_place" placeholder="Place">
  <input id="child_photo" type="file">
  <button onclick="registerChild()">Upload</button>
</div>
<!-- ADMIN DASHBOARD -->
<div class="container page" id="adminDashboard" style="display:none;">
  <h2>Admin Panel</h2>
  <p>Delete child by ID:</p>
  <input type="number" id="deleteId" placeholder="Child ID">
  <button onclick="deleteChild()">Delete Child</button>
</div>

<!-- CROSSCHECK -->
<div class="container page" id="crosscheck">
  <h2>Cross Check</h2>

  <h4>Image</h4>
  <input id="check_photo" type="file" accept="image/*">
  <button onclick="crossCheckImage()">Check Image</button>

  <h4>Video</h4>
  <input id="check_video" type="file" accept="video/*">
  <button onclick="crossCheckVideo()">Check Video</button>
</div>

<script src="script.js"></script>
</body>
</html>
